<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "DM Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "DM Mono", Menlo, Consolas, monospace; }
    .sec-label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.14em; fill: #656d76; }
    .counter { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; fill: #656d76; }
    .ctrl-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1f2328; }
    .card-num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.12em; fill: #656d76; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.025em; fill: #1f2328; }
    .card-body { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 400; fill: #1f2328; }
    .link-btn-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.08em; fill: #1f2328; }
    .results-copy { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; fill: #656d76; }

    @keyframes fadeSlide {
      0%, 14.5% { opacity: 1; }
      16.66%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes barDot {
      0%, 14.5% { fill: #1f2328; }
      16.66%, 100% { fill: #d0d7de; }
    }

    .slide { opacity: 0; animation: fadeSlide 15s infinite; }
    .s1 { animation-delay: 0s; opacity: 1; }
    .s2 { animation-delay: 2.5s; }
    .s3 { animation-delay: 5s; }
    .s4 { animation-delay: 7.5s; }
    .s5 { animation-delay: 10s; }
    .s6 { animation-delay: 12.5s; }

    .dot { fill: #d0d7de; animation: barDot 15s infinite; }
    .d1 { animation-delay: 0s; fill: #1f2328; }
    .d2 { animation-delay: 2.5s; }
    .d3 { animation-delay: 5s; }
    .d4 { animation-delay: 7.5s; }
    .d5 { animation-delay: 10s; }
    .d6 { animation-delay: 12.5s; }
  </style>

  <!-- Clean white GitHub-compatible canvas -->
  <rect x="0" y="0" width="880" height="306" fill="#ffffff"/>

  <!-- Top Bar (.about-carousel-top) -->
  <text x="0" y="16" class="sec-label">// about · blog — more quick thoughts than blog posts</text>
  <text x="0" y="42" class="counter slide s1">01 / 06</text>
  <text x="0" y="42" class="counter slide s2">02 / 06</text>
  <text x="0" y="42" class="counter slide s3">03 / 06</text>
  <text x="0" y="42" class="counter slide s4">04 / 06</text>
  <text x="0" y="42" class="counter slide s5">05 / 06</text>
  <text x="0" y="42" class="counter slide s6">06 / 06</text>

  <!-- Prev / Next controls (.about-control) -->
  <g transform="translate(774, 14)">
    <rect x="0" y="0" width="48" height="36" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="18" y="22" class="ctrl-text">&#8592;</text>
    <rect x="58" y="0" width="48" height="36" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="76" y="22" class="ctrl-text">&#8594;</text>
  </g>

  <!-- Viewport top and bottom rules (.about-viewport) -->
  <line x1="0" y1="64" x2="880" y2="64" stroke="#1f2328" stroke-width="1"/>
  <line x1="0" y1="268" x2="880" y2="268" stroke="#1f2328" stroke-width="1"/>

  <!-- Inner Card (.about-card-inner) -->
  <rect x="0.5" y="84.5" width="879" height="163" fill="#fcfcfa" stroke="#1f2328" stroke-width="1"/>
  <!-- Vertical divider between left 180px title column and right body column -->
  <line x1="214" y1="102" x2="214" y2="230" stroke="#eaeef2" stroke-width="1"/>

  <g class="slide s1">
    <text x="22" y="116" class="card-num">01</text>
    <text x="22" y="148" class="card-title">startups and</text>
<text x="22" y="173" class="card-title">building something</text>
    <text x="236" y="124" class="card-body">i think a lot about building something of my own one day. not even in a huge</text>
<text x="236" y="146" class="card-body">way, just something real that people actually use. something that starts small</text>
<text x="236" y="168" class="card-body">and slowly gets better. i like being around people who are building too.</text>
    <rect x="236.0" y="198" width="211.2" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">make something people want</text>
<rect x="457.2" y="198" width="81.6" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="469.2" y="216" class="link-btn-text">startups</text>
<rect x="548.8" y="198" width="117.6" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="560.8" y="216" class="link-btn-text">indie hackers</text>
  </g>
  <g class="slide s2">
    <text x="22" y="116" class="card-num">02</text>
    <text x="22" y="148" class="card-title">sports i enjoy</text>
<text x="22" y="173" class="card-title">playing with friends</text>
    <text x="236" y="124" class="card-body">i really like badminton and volleyball even though i was never that good at</text>
<text x="236" y="146" class="card-body">either. it's more about just playing with friends and having something fun</text>
<text x="236" y="168" class="card-body">and fast-paced to do. i still enjoy it a lot even if i'm not the best at it.</text>
    <rect x="236.0" y="198" width="132.0" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">badminton bible</text>
<rect x="378.0" y="198" width="160.8" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="390.0" y="216" class="link-btn-text">volleyball coaching</text>
  </g>
  <g class="slide s3">
    <text x="22" y="116" class="card-num">03</text>
    <text x="22" y="148" class="card-title">tech news and</text>
<text x="22" y="173" class="card-title">updates i keep up with</text>
    <text x="236" y="124" class="card-body">i don't follow news in a super structured way. mostly just check a few places</text>
<text x="236" y="146" class="card-body">and see what's happening. product launches, funding, new tools. it's less</text>
<text x="236" y="168" class="card-body">about knowing everything and more about staying loosely aware.</text>
    <rect x="236.0" y="198" width="96.0" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">techcrunch</text>
<rect x="342.0" y="198" width="88.8" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="354.0" y="216" class="link-btn-text">the verge</text>
<rect x="440.8" y="198" width="110.4" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="452.8" y="216" class="link-btn-text">product hunt</text>
  </g>
  <g class="slide s4">
    <text x="22" y="116" class="card-num">04</text>
    <text x="22" y="148" class="card-title">professional</text>
<text x="22" y="173" class="card-title">sidequest starter</text>
    <text x="236" y="124" class="card-body">i tend to start things on the side without making it a big deal. sometimes</text>
<text x="236" y="146" class="card-body">it's just an idea i want to test. i don't really wait for things to be</text>
<text x="236" y="168" class="card-body">perfect. i just start and see what happens.</text>
    <rect x="236.0" y="198" width="182.4" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">y combinator mvp guide</text>
<rect x="428.4" y="198" width="132.0" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="440.4" y="216" class="link-btn-text">build in public</text>
<rect x="570.4" y="198" width="67.2" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="582.4" y="216" class="link-btn-text">vercel</text>
  </g>
  <g class="slide s5">
    <text x="22" y="116" class="card-num">05</text>
    <text x="22" y="148" class="card-title">science advances</text>
<text x="22" y="173" class="card-title">/newsletters</text>
    <text x="236" y="124" class="card-body">i like reading about science and healthcare progress, even if i don't go</text>
<text x="236" y="146" class="card-body">super deep into it. mostly through newsletters and short updates. new</text>
<text x="236" y="168" class="card-body">treatments, biotech stuff, small breakthroughs.</text>
    <rect x="236.0" y="198" width="132.0" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">nature briefing</text>
<rect x="378.0" y="198" width="88.8" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="390.0" y="216" class="link-btn-text">stat news</text>
<rect x="476.8" y="198" width="225.6" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="488.8" y="216" class="link-btn-text">mit technology review biomed</text>
  </g>
  <g class="slide s6">
    <text x="22" y="116" class="card-num">06</text>
    <text x="22" y="148" class="card-title">i like getting lost</text>
<text x="22" y="173" class="card-title">on reddit ¯\_(ツ)_/¯</text>
    <text x="236" y="124" class="card-body">i spend more time on reddit than i probably should. but there's a lot you</text>
<text x="236" y="146" class="card-body">can learn from people just sharing what they've done. real experiences, not</text>
<text x="236" y="168" class="card-body">polished versions. you'll find stuff you wouldn't really see anywhere else.</text>
    <rect x="236.0" y="198" width="160.8" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="248.0" y="216" class="link-btn-text">reddit entrepreneur</text>
<rect x="406.8" y="198" width="103.2" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="418.8" y="216" class="link-btn-text">hacker news</text>
<rect x="520.0" y="198" width="67.2" height="28" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      <text x="532.0" y="216" class="link-btn-text">are.na</text>
  </g>

  <!-- Footer (.about-footer): horizontal 24x2px line dots + showing 6 thoughts -->
  <rect x="0" y="292" width="24" height="2" class="dot d1"/>
  <rect x="32" y="292" width="24" height="2" class="dot d2"/>
  <rect x="64" y="292" width="24" height="2" class="dot d3"/>
  <rect x="96" y="292" width="24" height="2" class="dot d4"/>
  <rect x="128" y="292" width="24" height="2" class="dot d5"/>
  <rect x="160" y="292" width="24" height="2" class="dot d6"/>
  <text x="880" y="296" text-anchor="end" class="results-copy">showing 6 thoughts</text>
</svg>
