<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="920" height="265">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 700; fill: #141412; }
    .kicker { font-size: 11px; font-weight: 500; fill: #767676; letter-spacing: 0.03em; }
    .card-title { font-size: 15px; font-weight: 700; fill: #141412; }
    .card-body { font-size: 12px; fill: #52524e; }
    .card-accent { font-size: 11.5px; font-weight: 600; fill: #0d7a5f; }
  </style>

  <!-- Outer container -->
  <rect x="2" y="2" width="916" height="261" rx="18" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(26, 24)">
    <circle cx="10" cy="10" r="8" fill="none" stroke="#141412" stroke-width="1.5"/>
    <ellipse cx="10" cy="10" rx="3.8" ry="8" fill="none" stroke="#141412" stroke-width="1.3"/>
    <line x1="2" y1="10" x2="18" y2="10" stroke="#141412" stroke-width="1.3"/>
    <text x="28" y="15" class="font-sans title">Away from the keyboard</text>
    <text x="242" y="14" class="font-mono kicker">// about &amp; quick thoughts from lakshman-codes.github.io</text>
  </g>

  <!-- Card 1: Clean UI & Sidequests -->
  <g transform="translate(22, 62)">
    <rect x="0" y="0" width="208" height="182" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <g transform="translate(56, 20)">
      <rect x="0" y="0" width="96" height="64" rx="8" fill="#f5f5f1" stroke="#141412" stroke-width="1.4"/>
      <line x1="0" y1="15" x2="96" y2="15" stroke="#141412" stroke-width="1.2"/>
      <circle cx="9" cy="7.5" r="2.2" fill="#e57373"/>
      <circle cx="17" cy="7.5" r="2.2" fill="#ffd54f"/>
      <circle cx="25" cy="7.5" r="2.2" fill="#81c784"/>
      <rect x="10" y="24" width="32" height="28" rx="4" fill="#d9ead3" stroke="#141412" stroke-width="1.2"/>
      <rect x="48" y="24" width="38" height="11" rx="3" fill="#cfe2f3" stroke="#141412" stroke-width="1.2"/>
      <rect x="48" y="41" width="26" height="11" rx="3" fill="#fce5cd" stroke="#141412" stroke-width="1.2"/>
    </g>
    <text x="18" y="114" class="font-sans card-title">Clean UI &amp; sidequests</text>
    <text x="18" y="136" class="font-sans card-body">Spacing, speed, and interfaces</text>
    <text x="18" y="153" class="font-sans card-body">that feel simple on purpose.</text>
    <text x="18" y="170" class="font-sans card-accent">Always testing new ideas</text>
  </g>

  <!-- Card 2: Startups & Building -->
  <g transform="translate(243, 62)">
    <rect x="0" y="0" width="208" height="182" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <g transform="translate(66, 18)">
      <polygon points="38,6 64,19 38,32 12,19" fill="#b6d7a8" stroke="#141412" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="12,19 38,32 38,58 12,45" fill="#93c47d" stroke="#141412" stroke-width="1.4" stroke-linejoin="round"/>
      <polygon points="64,19 38,32 38,58 64,45" fill="#d9ead3" stroke="#141412" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M72 8 L75 15 L82 18 L75 21 L72 28 L69 21 L62 18 L69 15 Z" fill="#ffd966" stroke="#141412" stroke-width="1.2"/>
    </g>
    <text x="18" y="114" class="font-sans card-title">Startups &amp; building</text>
    <text x="18" y="136" class="font-sans card-body">Starting small and shipping real</text>
    <text x="18" y="153" class="font-sans card-body">tools that people actually use.</text>
    <text x="18" y="170" class="font-sans card-accent">PG · YC · Indie Hackers</text>
  </g>

  <!-- Card 3: Science & Deep Dives -->
  <g transform="translate(464, 62)">
    <rect x="0" y="0" width="208" height="182" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <g transform="translate(73, 14)">
      <rect x="0" y="0" width="62" height="76" rx="7" fill="#eeeadd" stroke="#141412" stroke-width="1.4"/>
      <rect x="6" y="6" width="50" height="64" rx="4" fill="#3b5249"/>
      <text x="11" y="17" class="font-mono" font-size="6.2" font-weight="700" fill="#ffffff">FIELD NOTE</text>
      <circle cx="31" cy="38" r="14" fill="#6b9080"/>
      <path d="M23 38 C27 28, 35 48, 39 38" fill="none" stroke="#eeeadd" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="58" x2="46" y2="58" stroke="#c2c5aa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="12" y1="63" x2="34" y2="63" stroke="#c2c5aa" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="18" y="114" class="font-sans card-title">Science &amp; rabbit holes</text>
    <text x="18" y="136" class="font-sans card-body">Biotech breakthroughs, tech</text>
    <text x="18" y="153" class="font-sans card-body">launches &amp; builder threads.</text>
    <text x="18" y="170" class="font-sans card-accent">Nature · STAT · HN · Reddit</text>
  </g>

  <!-- Card 4: On the Court -->
  <g transform="translate(685, 62)">
    <rect x="0" y="0" width="213" height="182" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <g transform="translate(56, 20)">
      <rect x="0" y="8" width="98" height="52" rx="6" fill="#f5f5f1" stroke="#141412" stroke-width="1.4"/>
      <line x1="49" y1="8" x2="49" y2="60" stroke="#141412" stroke-width="1.3" stroke-dasharray="3,3"/>
      <circle cx="27" cy="34" r="11" fill="#cfe2f3" stroke="#141412" stroke-width="1.4"/>
      <path d="M20 27 Q27 34 34 27 M20 41 Q27 34 34 41" fill="none" stroke="#141412" stroke-width="1.1"/>
      <polygon points="70,42 82,24 88,30" fill="#ffd966" stroke="#141412" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="68" cy="44" r="3.5" fill="#e57373" stroke="#141412" stroke-width="1.2"/>
    </g>
    <text x="18" y="114" class="font-sans card-title">Badminton &amp; volleyball</text>
    <text x="18" y="136" class="font-sans card-body">Fast-paced games on the court</text>
    <text x="18" y="153" class="font-sans card-body">with friends whenever I'm off.</text>
    <text x="18" y="170" class="font-sans card-accent">Pure fun &gt; perfection</text>
  </g>
</svg>
