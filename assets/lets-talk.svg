<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 175" width="920" height="175">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 700; fill: #141412; }
    .kicker { font-size: 11px; font-weight: 500; fill: #767676; letter-spacing: 0.03em; }
    .num { font-size: 10.5px; font-weight: 600; fill: #8a8a84; }
    .card-title { font-size: 14px; font-weight: 700; fill: #141412; }
    .card-handle { font-size: 12px; font-weight: 600; fill: #0d7a5f; }
    .arrow { font-size: 13px; font-weight: 700; fill: #141412; }
  </style>

  <!-- Outer container -->
  <rect x="2" y="2" width="916" height="171" rx="18" fill="#f7f7f4" stroke="#e2e2dc" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(26, 22)">
    <path d="M2 5 L18 5 L18 16 L2 16 Z" fill="none" stroke="#141412" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M2 6 L10 11.5 L18 6" fill="none" stroke="#141412" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="28" y="15" class="font-sans title">Let's talk</text>
    <text x="115" y="14" class="font-mono kicker">// building something cool, collaborating, or just saying hi</text>
  </g>

  <!-- 01 Website -->
  <g transform="translate(22, 58)">
    <rect x="0" y="0" width="208" height="96" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <text x="16" y="24" class="font-mono num">01 / PORTFOLIO &amp; RESUME</text>
    <text x="16" y="52" class="font-sans card-title">Website</text>
    <text x="16" y="74" class="font-mono card-handle">lakshman-codes.github.io</text>
    <text x="182" y="52" class="font-sans arrow">-&gt;</text>
  </g>

  <!-- 02 LinkedIn -->
  <g transform="translate(243, 58)">
    <rect x="0" y="0" width="208" height="96" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <text x="16" y="24" class="font-mono num">02 / NETWORK</text>
    <text x="16" y="52" class="font-sans card-title">LinkedIn</text>
    <text x="16" y="74" class="font-mono card-handle">in/lakshmanr08</text>
    <text x="182" y="52" class="font-sans arrow">-&gt;</text>
  </g>

  <!-- 03 GitHub -->
  <g transform="translate(464, 58)">
    <rect x="0" y="0" width="208" height="96" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <text x="16" y="24" class="font-mono num">03 / CODE &amp; REPOS</text>
    <text x="16" y="52" class="font-sans card-title">GitHub</text>
    <text x="16" y="74" class="font-mono card-handle">@LaxExe</text>
    <text x="182" y="52" class="font-sans arrow">-&gt;</text>
  </g>

  <!-- 04 X / Twitter -->
  <g transform="translate(685, 58)">
    <rect x="0" y="0" width="213" height="96" rx="14" fill="#ffffff" stroke="#e6e6e0" stroke-width="1.2"/>
    <text x="16" y="24" class="font-mono num">04 / UPDATES &amp; DM</text>
    <text x="16" y="52" class="font-sans card-title">X / Twitter</text>
    <text x="16" y="74" class="font-mono card-handle">@Lakshman_r08</text>
    <text x="187" y="52" class="font-sans arrow">-&gt;</text>
  </g>
